<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USER UNFRIENDLY · Host</title>
  <link rel="stylesheet" href="/unfriendly/brand/user-unfriendly.css">
  <link rel="stylesheet" href="/unfriendly/css/unfriendly.css">
</head>
<body class="host">
  <header class="host__bar">
    <span class="host__phase" id="phase">…</span>
    <span class="mono" id="laptop-time"></span>
    <span class="mono" id="conn">Connecting…</span>
    <span class="host__join mono" id="join"></span>
  </header>
  <div class="host__body">
    <div class="stack" id="side"></div>
    <div class="stack" id="teams"></div>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="uu-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="uu-window__bar"><span id="modal-bar">ARE YOU SURE?</span><span>×</span></div>
      <div class="uu-window__body">
        <span class="uu-window__icon" aria-hidden="true">!</span>
        <div><p class="uu-window__title" id="modal-title"></p><p class="uu-window__text" id="modal-text" style="white-space: pre-line"></p></div>
        <div class="uu-window__actions"><button class="uu-btn" type="button" id="modal-no">No</button><button class="uu-btn uu-btn--ink" type="button" id="modal-yes">Yes</button></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="alert" hidden></div>
  <script type="module" src="/unfriendly/js/host.js"></script>
</body>
</html>
